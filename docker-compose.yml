name: docsflow

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-docsflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-docsflow-secret}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # веб-консоль
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Бакет создаёт инфраструктура, а не приложение: приложению права на создание бакетов не нужны.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-docsflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-docsflow-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-docsflow}
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set none "local/$$MINIO_BUCKET"

volumes:
  minio-data:
