name: docsflow

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-docsflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-docsflow-secret}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # веб-консоль
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Бакет создаёт инфраструктура, а не приложение: приложению права на создание бакетов не нужны.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-docsflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-docsflow-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-docsflow}
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set none "local/$$MINIO_BUCKET"

  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docsflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docsflow-secret}
      POSTGRES_DB: ${POSTGRES_DB:-docsflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Заводит базу для Keycloak. Исполняется только при инициализации пустого тома —
      # на уже существующем postgres-data базу нужно создать руками (см. infra/postgres/init).
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docsflow} -d ${POSTGRES_DB:-docsflow}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Схему накатывает инфраструктура, а не приложение: приложению права на DDL не нужны.
  migrator:
    build:
      context: .
      dockerfile: src/DocsFlow.Database.Migrator/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      Database__Postgres__ConnectionString: "Host=postgres;Port=5432;Username=${POSTGRES_USER:-docsflow};Password=${POSTGRES_PASSWORD:-docsflow-secret};Database=${POSTGRES_DB:-docsflow}"

  # Аутентификация и учётные данные пользователей. Приложение к Admin API не обращается —
  # регистрацию, подтверждение email и восстановление пароля Keycloak делает сам.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    # start-dev — только для локальной разработки: он не требует TLS и не проверяет hostname.
    # Продакшн — start с KC_HOSTNAME и сертификатами.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-docsflow}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-docsflow-secret}
    volumes:
      # Realm импортируется только если его ещё нет: правки в файле на созданный realm не влияют.
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      # 8080 внутри контейнера, 8081 на хосте: на 8080 хоста живёт nginx с веб-клиентом.
      - "8081:8080"   # админка и страницы входа
    depends_on:
      postgres:
        condition: service_healthy

  # Перехватывает письма Keycloak (подтверждение email, восстановление пароля), чтобы наружу
  # из разработки ничего не уходило. В приложение не входит и в продакшн-конфигурацию не попадает.
  mailpit:
    image: axllent/mailpit:v1.30.6
    ports:
      - "1025:1025"   # SMTP, сюда пишет Keycloak
      - "8025:8025"   # веб-интерфейс: читать письма

  # Собранный клиент отдаёт nginx, а не бэкенд: статика и API живут отдельными процессами.
  # Он же проксирует /api, поэтому браузер видит один origin и обходится без CORS.
  web:
    build:
      context: client
    environment:
      # Пока API запускается на хосте через `dotnet run`. Когда он переедёт в compose,
      # значение станет http://api:8080.
      API_ORIGIN: ${API_ORIGIN:-http://host.docker.internal:5023}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  minio-data:
  postgres-data:
