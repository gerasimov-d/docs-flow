# Подключается в каждый location, где есть свой add_header: директива add_header в location
# отменяет все унаследованные, поэтому заголовки приходится повторять явно.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
